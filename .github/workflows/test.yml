name: Testes
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validar snapshots
        run: |
          shopt -s nullglob
          files=(data/runs/*.json)
          if [ ${#files[@]} -gt 0 ]; then node scripts/validate.mjs "${files[@]}"; fi
